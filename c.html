<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying Wizard Challenge</title>
<meta property="og:title" content="You've been challenged in Flying Wizard!">
<meta property="og:description" content="Fly the same course and beat your friend's ghost.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1545; --sky:#9454fa; --deep:#5c28c7; --yellow:#ffe040; --green:#5cdb4d; --greendeep:#21992f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         font-family:'Lilita One', system-ui, sans-serif; color:#fff;
         background:radial-gradient(circle at 50% 30%, var(--sky), var(--deep)); }
  .card { width:100%; max-width:420px; text-align:center; background:linear-gradient(var(--sky), var(--deep));
          border:4px solid var(--ink); border-radius:28px; padding:28px 22px 24px; box-shadow:0 8px 0 var(--ink); }
  .logo { line-height:.9; transform:rotate(-4deg); margin-bottom:18px; }
  .logo .a { color:var(--yellow); font-size:34px; }
  .logo .b { font-size:50px; }
  .logo span { display:block; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); }
  h1 { margin:6px 0 2px; font-size:30px; color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; }
  p { margin:6px 0; font-size:18px; }
  .score { font-size:64px; color:var(--yellow); -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 5px 0 var(--ink); }
  .btn { display:block; margin:14px 0 0; padding:16px; border-radius:18px; border:4px solid var(--ink); font-size:22px;
         color:#fff; text-decoration:none; box-shadow:0 6px 0 var(--ink); }
  .open { background:linear-gradient(var(--green), var(--greendeep)); }
  .get { background:linear-gradient(#ffad29, #eb6600); }
  .small { font-family:system-ui, sans-serif; font-size:13px; opacity:.85; margin-top:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="a">FLYING</span><span class="b">WIZARD</span></div>
  <h1 id="who">A friend challenges you!</h1>
  <p>They flew through</p>
  <div class="score" id="score">?</div>
  <p>rings. Fly the same course and beat their ghost!</p>
  <a class="btn open" id="open" href="flyingwizard://c">Open in Flying Wizard</a>
  <a class="btn get" href="https://apps.apple.com/app/id6817508593">Get Flying Wizard</a>
  <div class="small">Got the game already? Tap Open. New? Get it, then come back here and tap Open.</div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var name = (q.get('n') || '').slice(0, 20), score = (q.get('s') || '').replace(/[^0-9]/g, '').slice(0, 5);
  if (name) document.getElementById('who').textContent = name + ' challenges you!';
  if (score) document.getElementById('score').textContent = score;
  document.getElementById('open').href = 'flyingwizard://c' + location.hash;
</script>
</body>
</html>
